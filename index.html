<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycleCare - Period Tracker</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-light: #f8bbd0;
            --bg-gradient: linear-gradient(135deg, #fce4ec, #f8bbd0);
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        #alert-box {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            display: none;
            border: 1px: solid #ffcdd2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #ad1457;
        }

        .results-card {
            margin-top: 25px;
            background: #fdf2f4;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
        }

        .results-card h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .results-card p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CycleCare</h2>
        <p class="subtitle">Your personal, private period & health companion</p>

        <!-- 5-Day Advance Alert Banner -->
        <div id="alert-box"></div>

        <!-- User Input Form -->
        <form id="tracker-form">
            <div class="form-group">
                <label for="last-date">Last Period Start Date:</label>
                <input type="date" id="last-date" required>
            </div>

            <div class="form-group">
                <label for="period-duration">How many days did the period last?</label>
                <input type="number" id="period-duration" placeholder="e.g., 5" min="1" max="15" required>
            </div>

            <div class="form-group">
                <label for="cycle-length">Average Cycle Length (Days):</label>
                <input type="number" id="cycle-length" value="28" min="21" max="45" required>
            </div>

            <button type="submit">Save & Calculate</button>
        </form>

        <!-- Display Results Platform -->
        <div class="results-card" id="results-section" style="display: none;">
            <h3>Cycle Insights</h3>
            <p><strong>Period Duration:</strong> <span id="res-duration">-</span> days</p>
            <p><strong>Next Expected Period:</strong> <span id="res-next-date">-</span></p>
            <p><strong>Status:</strong> <span id="res-countdown">-</span></p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("tracker-form");
            const alertBox = document.getElementById("alert-box");
            const resultsSection = document.getElementById("results-section");
            
            const lastDateInput = document.getElementById("last-date");
            const periodDurationInput = document.getElementById("period-duration");
            const cycleLengthInput = document.getElementById("cycle-length");

            const resDuration = document.getElementById("res-duration");
            const resNextDate = document.getElementById("res-next-date");
            const resCountdown = document.getElementById("res-countdown");

            // Load saved details from localStorage (Requirement 1)
            const savedData = JSON.parse(localStorage.getItem("cycleData"));
            if (savedData) {
                lastDateInput.value = savedData.lastDate;
                periodDurationInput.value = savedData.periodDuration;
                cycleLengthInput.value = savedData.cycleLength;
                calculateInsights(savedData.lastDate, parseInt(savedData.periodDuration), parseInt(savedData.cycleLength));
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                
                const lastDate = lastDateInput.value;
                const periodDuration = periodDurationInput.value;
                const cycleLength = parseInt(cycleLengthInput.value);

                // Save details (Requirement 1)
                const dataToSave = { lastDate, periodDuration, cycleLength };
                localStorage.setItem("cycleData", JSON.stringify(dataToSave));

                calculateInsights(lastDate, periodDuration, cycleLength);
            });

            function calculateInsights(lastDateStr, duration, cycleLen) {
                const lastDate = new Date(lastDateStr);
                
                // Calculate Next Period Start Date (Requirement 6)
                const nextPeriodDate = new Date(lastDate);
                nextPeriodDate.setDate(lastDate.getDate() + cycleLen);

                // Format date nicely
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const formattedNextDate = nextPeriodDate.toLocaleDateString(undefined, options);

                // Display duration and next date (Requirement 5 & 6)
                resDuration.innerText = duration;
                resNextDate.innerText = formattedNextDate;
                resultsSection.style.display = "block";

                // Check countdown for the 5-day alert (Requirement 4)
                const today = new Date();
                // Reset hours for accurate day-diff calculation
                today.setHours(0,0,0,0);
                nextPeriodDate.setHours(0,0,0,0);

                const diffTime = nextPeriodDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays > 0 && diffDays <= 5) {
                    alertBox.style.display = "block";
                    alertBox.innerHTML = `⚠️ Heads up! Your next period is expected in ${diffDays} day${diffDays > 1 ? 's' : ''} (${formattedNextDate}).`;
                } else if (diffDays === 0) {
                    alertBox.style.display = "block";
                    alertBox.innerHTML = `🔴 Your period is expected to start today!`;
                } else if (diffDays < 0) {
                    alertBox.style.display = "block";
                    alertBox.innerHTML = `ℹ️ Your expected start date has passed. Please update your logs if your period has arrived.`;
                } else {
                    alertBox.style.display = "none";
                }

                resCountdown.innerText = diffDays > 0 ? `In ${diffDays} days` : (diffDays === 0 ? "Today" : "Due/Passed");
            }
        });
    </script>
</body>
</html>
